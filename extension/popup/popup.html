<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillMap Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>SkillMap</h1>
        <p id="auth-label" class="sub">Checking sign-in…</p>
      </div>
      <a href="#" id="options-link" class="gear" title="Settings">⚙</a>
    </header>

    <main id="main">
      <div id="state-empty" class="panel hidden">
        <p id="empty-detail" class="muted">Open a job posting on LinkedIn, Indeed, Greenhouse, or another careers page.</p>
        <p class="muted small">Tip: refresh the job tab (F5) after loading the extension, then detect again.</p>
        <button type="button" id="btn-retry" class="btn secondary">Detect job on page</button>
      </div>

      <form id="form-job" class="panel hidden">
        <div class="badge-row">
          <span id="extractor-badge" class="badge">detected</span>
          <span id="confidence-badge" class="badge muted"></span>
        </div>

        <label class="field">
          <span>Title</span>
          <input type="text" id="title" required />
        </label>
        <label class="field">
          <span>Company</span>
          <input type="text" id="company" />
        </label>
        <label class="field">
          <span>Location</span>
          <input type="text" id="location" />
        </label>
        <div class="row-2">
          <label class="field">
            <span>Category</span>
            <select id="category">
              <option value="tech">Tech</option>
              <option value="design">Design</option>
              <option value="uiux">UI/UX</option>
            </select>
          </label>
          <label class="field">
            <span>Job type</span>
            <select id="job_type">
              <option value="full_time">Full time</option>
              <option value="part_time">Part time</option>
              <option value="contract">Contract</option>
              <option value="internship">Internship</option>
              <option value="remote">Remote</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>URL</span>
          <input type="url" id="url" required />
        </label>
        <label class="field">
          <span>Description</span>
          <textarea id="description" rows="4"></textarea>
        </label>

        <p id="status" class="status hidden" role="status"></p>

        <button type="submit" id="btn-import" class="btn primary">Import to SkillMap</button>
        <button type="button" id="btn-refresh" class="btn secondary">Re-detect</button>
      </form>

      <div id="state-login" class="panel hidden">
        <p class="muted">Sign in with your SkillMap account to import jobs.</p>
        <button type="button" id="btn-open-options" class="btn primary">Open settings & sign in</button>
      </div>
    </main>

    <script src="../dist/popup.js"></script>
  </body>
</html>
