services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillmap}
      POSTGRES_USER: ${POSTGRES_USER:-skillmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillmap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published: a local Postgres already owns 5432 and services reach
    # this one as db:5432 inside the Compose network. Add a mapping such as
    # "5433:5432" if you need to attach an external client.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillmap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  django-celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery worker -Q django --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info
    volumes:
      - ./scraper:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A tasks beat --loglevel=info
    volumes:
      - ./scraper:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python app.py
    volumes:
      - ./scraper:/app
    ports:
      - "5001:5000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite dev server, not the nginx production stage, so the bind mount
      # below gives hot reload. Build without a target for the nginx image.
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      # Vite's /api proxy runs inside this container, so it reaches the backend
      # by service name. Deliberately not a VITE_ var: VITE_API_BASE_URL stays
      # as .env sets it, because the browser resolves that one.
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
