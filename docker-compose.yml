services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillmap}
      POSTGRES_USER: ${POSTGRES_USER:-skillmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillmap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillmap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  django-celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery worker -Q django --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info
    volumes:
      - ./scraper:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A tasks beat --loglevel=info
    volumes:
      - ./scraper:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python app.py
    volumes:
      - ./scraper:/app
    ports:
      - "5001:5000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file: .env
    depends_on:
      - backend

volumes:
  postgres_data:
